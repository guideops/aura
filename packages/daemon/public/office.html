<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA — office</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; overflow:hidden; font:13px/1.4 -apple-system, "Segoe UI", sans-serif; background:#eef1f5; }
  #hud { position:fixed; top:12px; left:12px; background:#fffc; backdrop-filter:blur(8px);
         border:1px solid #dde3ea; border-radius:10px; padding:10px 14px; min-width:180px; }
  #hud b { letter-spacing:.12em; }
  #hud .dim { color:#68758a; font-size:11px; }
  #panel { position:fixed; top:12px; right:12px; width:250px; background:#fffc; backdrop-filter:blur(8px);
           border:1px solid #dde3ea; border-radius:10px; padding:12px 14px; display:none; }
  #panel h3 { margin:0 0 6px; font-size:14px; }
  #panel .row { display:flex; justify-content:space-between; padding:2px 0; color:#3a4453; }
  #panel .row span:first-child { color:#68758a; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud"><b>AURA</b> <span class="dim" id="conn">connecting…</span><div class="dim" id="count"></div></div>
<div id="panel"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

// ---------- default .space layout (greybox) ----------
const ZONES = [
  { id:"desk-01", kind:"desk", label:"Desk 01 — Active Compute", pos:[0,0,0], size:[2.2,0.8,1.0], color:0x8a6b4d },
  { id:"desk-02", kind:"desk", label:"Desk 02 — Active Compute", pos:[2.8,0,-1.2], size:[2.2,0.8,1.0], color:0x8a6b4d },
  { id:"vault", kind:"vault", label:"Vault — Secure Storage", pos:[-4.2,0,-3.2], size:[1.4,2.2,1.2], color:0x9aa7b6 },
  { id:"whiteboard", kind:"whiteboard", label:"Whiteboard — Ideas & Planning", pos:[-4.6,0,1.6], size:[0.15,1.6,2.6], color:0xf4f7fa },
  { id:"kanban", kind:"kanban-wall", label:"Kanban Wall — Work Items", pos:[1.5,0,-4.4], size:[3.6,1.8,0.15], color:0xe8edf4 },
  { id:"gate", kind:"security-gate", label:"Security Gate — Access Control", pos:[4.6,0,1.8], size:[0.5,1.9,1.6], color:0xb9c2cf },
  { id:"lounge", kind:"lounge", label:"Lounge — Idle", pos:[-1.8,0,3.6], size:[2.6,0.5,1.4], color:0xd9c8b8 },
  { id:"skills", kind:"skills-library", label:"Skills Library", pos:[4.4,0,-3.4], size:[1.6,2.0,0.5], color:0xcbb391 },
];
const SLOTS = {
  desk: [[0,0,1.1],[2.8,0,-0.1],[-0.9,0,0.9],[3.6,0,-1.0],[0.9,0,1.3],[2.0,0,0.2]],
  gate: [[3.7,0,1.8],[3.7,0,2.6]],
  lounge: [[-1.4,0,3.4],[-2.4,0,3.6],[-1.8,0,4.2]],
  idleWander: [[0.5,0,2.0],[-3.0,0,-1.5],[2.0,0,3.0],[-0.5,0,-2.5]],
};
const COLORS = { blue:0x3b82f6, green:0x22c55e, orange:0xf97316, purple:0x8b5cf6, red:0xef4444, yellow:0xeab308 };

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);

const aspect = innerWidth / innerHeight;
const D = 7.5;
const camera = new THREE.OrthographicCamera(-D*aspect, D*aspect, D, -D, 0.1, 100);
camera.position.set(12, 12, 12);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -12;
sun.shadow.camera.right = sun.shadow.camera.top = 12;
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.BoxGeometry(12, 0.3, 10),
  new THREE.MeshStandardMaterial({ color:0xf7f9fb }),
);
floor.position.y = -0.15;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(12, 24, 0xd5dce4, 0xe4e9ef);
grid.position.y = 0.01;
scene.add(grid);

function makeLabel(text) {
  const c = document.createElement("canvas");
  const x = c.getContext("2d");
  c.width = 512; c.height = 64;
  x.fillStyle = "rgba(255,255,255,0.92)";
  x.roundRect(0, 0, 512, 64, 18); x.fill();
  x.fillStyle = "#2a3342"; x.font = "26px 'Segoe UI', sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(text, 256, 34);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true }));
  sprite.scale.set(2.6, 0.33, 1);
  return sprite;
}

for (const z of ZONES) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(...z.size),
    new THREE.MeshStandardMaterial({ color: z.color }),
  );
  mesh.position.set(z.pos[0], z.size[1]/2, z.pos[2]);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  const label = makeLabel(z.label);
  label.position.set(z.pos[0], z.size[1] + 0.55, z.pos[2]);
  scene.add(label);
}

// ---------- agents ----------
const agents = new Map(); // agentId -> { group, target, data, slot }
const capsuleGeo = new THREE.CapsuleGeometry(0.22, 0.35, 6, 14);
const headGeo = new THREE.SphereGeometry(0.16, 16, 12);

function agentColor(agentId) {
  const name = agentId.split("-")[0];
  return COLORS[name] ?? 0x64748b;
}

function ensureAgent(a) {
  let entry = agents.get(a.agentId);
  if (!entry) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(capsuleGeo, new THREE.MeshStandardMaterial({ color: agentColor(a.agentId) }));
    body.position.y = 0.45; body.castShadow = true;
    const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
    head.position.y = 0.95; head.castShadow = true;
    const tag = makeLabel(a.agentId);
    tag.scale.set(1.6, 0.2, 1);
    tag.position.y = 1.35;
    group.add(body, head, tag);
    group.userData.agentId = a.agentId;
    scene.add(group);
    entry = { group, target: new THREE.Vector3(0, 0, 0), data: a, wanderT: 0 };
    agents.set(a.agentId, entry);
  }
  entry.data = a;
  entry.target.fromArray(slotFor(a, entry));
  return entry;
}

let deskCursor = 0, gateCursor = 0, loungeCursor = 0;
function slotFor(a, entry) {
  switch (a.status) {
    case "active": case "researching": case "reading":
      entry.slot ??= SLOTS.desk[(deskCursor++) % SLOTS.desk.length];
      return entry.slot;
    case "blocked":
      return SLOTS.gate[(gateCursor++) % SLOTS.gate.length];
    case "idle": case "success":
      return SLOTS.lounge[(loungeCursor++) % SLOTS.lounge.length];
    case "offline":
      return [entry.group.position.x, -1.2, entry.group.position.z];
    default:
      return SLOTS.idleWander[Math.floor(Math.random()*SLOTS.idleWander.length)];
  }
}

// ---------- picking / panel ----------
const ray = new THREE.Raycaster();
const panel = document.getElementById("panel");
addEventListener("pointerdown", (e) => {
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hits = ray.intersectObjects([...agents.values()].map((a) => a.group), true);
  const top = hits[0]?.object?.parent?.userData?.agentId ?? hits[0]?.object?.userData?.agentId;
  if (top && agents.has(top)) {
    const a = agents.get(top).data;
    const tok = (a.tokens.input + a.tokens.output).toLocaleString();
    panel.style.display = "block";
    panel.innerHTML = `<h3>${a.agentId}</h3>
      <div class="row"><span>STATUS</span><span>${a.status}</span></div>
      <div class="row"><span>TASK</span><span>${a.task || "—"}</span></div>
      <div class="row"><span>TOKENS</span><span>${tok}</span></div>
      <div class="row"><span>SESSION</span><span>${a.sessionId.slice(0,8)}</span></div>`;
  } else panel.style.display = "none";
});

// ---------- live data ----------
const connEl = document.getElementById("conn");
const countEl = document.getElementById("count");
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { connEl.textContent = "live"; };
  ws.onclose = () => { connEl.textContent = "reconnecting…"; setTimeout(connect, 1500); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.kind === "hello") msg.agents.forEach(ensureAgent);
    else if (msg.kind === "snapshot") ensureAgent(msg.agent);
    countEl.textContent = `${agents.size} agents`;
  };
}
connect();

// debug handle (used by tests/tooling; not part of the UI contract)
window.__aura = { agents, scene, ZONES };

// ---------- loop ----------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const entry of agents.values()) {
    const p = entry.group.position;
    const t = entry.target;
    const dist = p.distanceTo(t);
    if (dist > 0.03) {
      p.lerp(t, Math.min(1, dt * 2.2));
      entry.group.rotation.y = Math.atan2(t.x - p.x, t.z - p.z);
      // walk bob
      entry.group.children[0].position.y = 0.45 + Math.abs(Math.sin(performance.now()/130)) * 0.06;
    } else {
      entry.group.children[0].position.y = 0.45 + Math.sin(performance.now()/900 + p.x) * 0.015; // idle breathe
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener("resize", () => {
  const a2 = innerWidth / innerHeight;
  camera.left = -D*a2; camera.right = D*a2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener("visibilitychange", () => {
  // perf rule: no rendering when hidden
  if (document.hidden) clock.stop(); else clock.start();
});
</script>
</body>
</html>
