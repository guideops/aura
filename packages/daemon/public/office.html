<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA — office</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; overflow:hidden; font:13px/1.4 -apple-system, "Segoe UI", sans-serif; background:#eef1f5; }
  #hud { position:fixed; top:12px; left:12px; background:#fffc; backdrop-filter:blur(8px);
         border:1px solid #dde3ea; border-radius:10px; padding:10px 14px; min-width:180px; }
  #hud b { letter-spacing:.12em; }
  #hud .dim { color:#68758a; font-size:11px; }
  /* Project filter. Unlike #hud this survives embed mode: the whole point is
     to calm a crowded floor, and the floor is busiest inside the shell. */
  #filterbar { position:fixed; left:12px; bottom:12px; display:none; gap:6px; flex-wrap:wrap;
               max-width:60vw; background:#fffc; backdrop-filter:blur(8px);
               border:1px solid #dde3ea; border-radius:10px; padding:8px 10px; }
  #filterbar .chip { border:1px solid #dde3ea; background:#fff; border-radius:999px; cursor:pointer;
                     padding:3px 10px; font:inherit; font-size:12px; color:#3a4453; }
  #filterbar .chip:hover { background:#f3f6fa; }
  #filterbar .chip.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  #filterbar .chip .n { opacity:.65; margin-left:5px; font-variant-numeric:tabular-nums; }
  #panel { position:fixed; top:12px; right:12px; width:250px; background:#fffc; backdrop-filter:blur(8px);
           border:1px solid #dde3ea; border-radius:10px; padding:12px 14px; display:none; }
  #panel h3 { margin:0 0 6px; font-size:14px; }
  #panel .row { display:flex; justify-content:space-between; padding:2px 0; color:#3a4453; }
  #panel .row span:first-child { color:#68758a; }
  canvas { display:block; }
  #approvals { position:fixed; bottom:12px; right:12px; width:320px; display:flex; flex-direction:column; gap:8px; }
  .ar { background:#fffdf7; border:1px solid #f0d9a8; border-left:4px solid #f59e0b; border-radius:10px;
        padding:10px 12px; box-shadow:0 4px 14px rgba(30,40,60,.08); }
  .ar .h { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .ar .agent { font-weight:600; color:#b45309; }
  .ar .tool { font-family:ui-monospace, monospace; font-size:11px; color:#3a4453; word-break:break-all; }
  .ar .reason { font-size:11px; color:#68758a; margin:4px 0 8px; }
  .ar .btns { display:flex; gap:8px; }
  .ar button { flex:1; border:0; border-radius:7px; padding:6px 0; font-weight:600; cursor:pointer; font-size:12px; }
  .ar .approve { background:#16a34a; color:#fff; }
  .ar .deny { background:#e5e7eb; color:#374151; }

  /* ---- dark theme (synced with the shell via localStorage "aura-theme") ---- */
  body.dark { color-scheme: dark; background:#0b0d12; }
  body.dark #hud, body.dark #panel, body.dark #filterbar {
    background:#12151ce6; border-color:#262c37; color:#e6eaf2; }
  body.dark #filterbar .chip { background:#1a1e27; border-color:#333c4a; color:#c4ccd9; }
  body.dark #filterbar .chip:hover { background:#262c37; }
  body.dark #filterbar .chip.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  body.dark #hud .dim, body.dark #panel .row span:first-child { color:#98a2b3; }
  body.dark #panel .row { color:#c4ccd9; }
  body.dark .ar { background:#1d1910; border-color:#4a3b18; }
  body.dark .ar .tool { color:#c4ccd9; }
  body.dark .ar .reason { color:#98a2b3; }
  body.dark .ar .deny { background:#262c37; color:#c4ccd9; }
  body.dark #cadbar, body.dark #cad-inspector {
    background:#12151c; border-color:#262c37; box-shadow:0 8px 24px rgba(0,0,0,.5); color:#e6eaf2; }
  body.dark #cadbar .cad-head b { color:#e6eaf2; }
  body.dark #cadbar .hint { color:#98a2b3; }
  body.dark #cadbar kbd { background:#1a1e27; border-color:#333c4a; color:#c4ccd9; }
  body.dark #cadbar button, body.dark #cadbar select { background:#1a1e27; border-color:#333c4a; color:#e6eaf2; }
  body.dark #cadbar button:hover { background:#262c37; }
  body.dark #cadbar #cad-save { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  body.dark #cad-inspector h4 { color:#e6eaf2; }
  body.dark #cad-inspector label { color:#98a2b3; }
  body.dark #cad-inspector input, body.dark #cad-inspector select {
    background:#1a1e27; border-color:#333c4a; color:#e6eaf2; }
</style>
</head>
<body>
<div id="hud"><b>AURA</b> <span class="dim" id="conn">loading assets…</span><div class="dim" id="count"></div></div>
<div id="panel"></div>
<div id="filterbar"></div>
<div id="approvals"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const PARAMS = new URLSearchParams(location.search);
// "mini" = System Overview widget in the shell: embed chrome-hidden + implies embed.
const MINI = PARAMS.has("mini");
const EMBED = PARAMS.has("embed") || MINI;
if (EMBED) {
  document.getElementById("hud").style.display = "none";
  document.getElementById("approvals").style.display = "none";
}

const COLORS = { blue:0x3b82f6, green:0x22c55e, orange:0xf97316, purple:0x8b5cf6, red:0xef4444, yellow:0xeab308 };
const M = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...opts });
const WHITE = 0xf6f8fa, STEEL = 0xaeb8c4, GLASS_C = 0xdfe9f2;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);
const aspect = innerWidth / innerHeight;
const D = 8.5;
const camera = new THREE.OrthographicCamera(-D*aspect, D*aspect, D, -D, 0.1, 100);
camera.position.set(14.5, 12, 14.5);
camera.lookAt(2.5, 0, 0);

// ---------- orbit: swivel the iso view around the room ----------
const CAM_TARGET = new THREE.Vector3(2.5, 0, 0);
const CAM_RADIUS = Math.hypot(14.5 - CAM_TARGET.x, 14.5 - CAM_TARGET.z);
let camAzimuth = Math.atan2(14.5 - CAM_TARGET.z, 14.5 - CAM_TARGET.x);
function applyCamera() {
  camera.position.set(
    CAM_TARGET.x + CAM_RADIUS * Math.cos(camAzimuth),
    camera.position.y,
    CAM_TARGET.z + CAM_RADIUS * Math.sin(camAzimuth),
  );
  camera.lookAt(CAM_TARGET);
}
let orbiting = null; // { startX, startAz }

const hemi = new THREE.HemisphereLight(0xffffff, 0xd8dee7, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.35);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -12;
sun.shadow.camera.right = sun.shadow.camera.top = 12;
sun.shadow.radius = 6;
scene.add(sun);

const floor = new THREE.Mesh(new THREE.BoxGeometry(12.4, 0.3, 10.4), M(0xf7f9fb));
floor.position.y = -0.15;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(12, 24, 0xdde3ea, 0xe9edf2);
grid.position.y = 0.005;
scene.add(grid);
// Council chamber annex (second room, right of the main office)
const annex = new THREE.Mesh(new THREE.BoxGeometry(8.4, 0.3, 8.4), M(0xf7f9fb));
annex.position.set(9.5, -0.15, 0.5);
annex.receiveShadow = true;
scene.add(annex);
const annexGrid = new THREE.GridHelper(8, 16, 0xdde3ea, 0xe9edf2);
annexGrid.position.set(9.5, 0.005, 0.5);
scene.add(annexGrid);
// Low glass divider between the rooms
const divider = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 5.6), M(GLASS_C, { transparent: true, opacity: 0.4, roughness: 0.1 }));
divider.position.set(5.9, 0.5, 1.0);
scene.add(divider);

// ---------- theme (follows the shell's toggle via localStorage) ----------
function applyTheme(dark) {
  document.body.classList.toggle("dark", dark);
  scene.background.setHex(dark ? 0x10141b : 0xeef1f5);
  for (const g of [grid, annexGrid]) {
    g.material.transparent = true;
    g.material.opacity = dark ? 0.22 : 1;
  }
  hemi.groundColor.setHex(dark ? 0x3a4250 : 0xd8dee7);
  hemi.intensity = dark ? 0.65 : 0.9;
  sun.intensity = dark ? 1.05 : 1.35;
}
const themeDark = () => localStorage.getItem("aura-theme") === "dark";
applyTheme(themeDark());
addEventListener("storage", (e) => { if (e.key === "aura-theme") applyTheme(themeDark()); });

function makeLabel(text, w = 2.6) {
  const c = document.createElement("canvas");
  const x = c.getContext("2d");
  c.width = 1024; c.height = 128;
  x.fillStyle = "rgba(255,255,255,0.97)";
  x.roundRect(0, 0, 1024, 128, 30); x.fill();
  x.strokeStyle = "#c7d0da"; x.lineWidth = 4; x.stroke();
  x.fillStyle = "#111a26"; x.font = "600 52px 'Segoe UI', sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(text, 512, 68);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthTest:false }));
  sprite.scale.set(w, w * 0.125, 1);
  return sprite;
}
const S = (g) => { g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return g; };
const box = (w,h,d,mat) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
const cyl = (r,h,mat,seg=20) => new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg), mat);

// ---------- asset loading ----------
const loader = new GLTFLoader();
const cache = new Map();
async function loadGlb(name) {
  if (cache.has(name)) return cache.get(name);
  const p = loader.loadAsync(`/assets/${name}.glb`).then((g) => g);
  cache.set(name, p);
  return p;
}
/** Instantiate a static GLB into `parent`, scaled so bbox width == targetW (or height == targetH). */
async function placeInto(parent, name, { targetW, targetH, pos = [0,0,0], rotY = 0 } = {}) {
  try {
    const gltf = await loadGlb(name);
    const obj = gltf.scene.clone(true);
    const bb = new THREE.Box3().setFromObject(obj);
    const size = bb.getSize(new THREE.Vector3());
    let s = 1;
    if (targetW) s = targetW / size.x;
    else if (targetH) s = targetH / size.y;
    obj.scale.setScalar(s);
    obj.position.set(pos[0], pos[1] ?? 0, pos[2]);
    obj.rotation.y = rotY;
    S(obj);
    parent.add(obj);
    return obj;
  } catch (e) {
    console.warn(`asset ${name} failed, skipping`, e);
    return null;
  }
}

// ---------- procedural pieces kept (no CC0 equivalent) ----------
function buildVault() {
  const g = new THREE.Group();
  const body = box(1.5, 2.2, 1.2, M(0x8f9caa, { metalness: 0.5, roughness: 0.35 })); body.position.y = 1.1; g.add(body);
  const door = box(0.1, 1.7, 0.95, M(0xa7b3c0, { metalness: 0.6, roughness: 0.3 }));
  door.position.set(0.78, 1.05, 0.1); g.add(door);
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.045, 10, 24), M(0x5f6b78, { metalness: 0.7 }));
  wheel.position.set(0.86, 1.05, 0.1); wheel.rotation.y = Math.PI / 2; g.add(wheel);
  for (const a of [0, Math.PI/2, Math.PI, -Math.PI/2]) {
    const spoke = box(0.03, 0.4, 0.03, M(0x5f6b78, { metalness: 0.7 }));
    spoke.position.set(0.86, 1.05, 0.1); spoke.rotation.x = a; g.add(spoke);
  }
  return S(g);
}
function buildWhiteboard() {
  const g = new THREE.Group();
  const panel = box(0.06, 1.5, 2.5, M(WHITE, { roughness: 0.25 })); panel.position.y = 1.35; g.add(panel);
  for (const [y, z, w, color] of [[1.7, -0.6, 0.8, 0x3b82f6], [1.45, -0.3, 1.1, 0x94a3b8], [1.2, -0.55, 0.7, 0x94a3b8], [1.6, 0.7, 0.6, 0xf97316], [1.1, 0.5, 0.9, 0x22c55e]]) {
    const stroke = box(0.012, 0.05, w, new THREE.MeshBasicMaterial({ color }));
    stroke.position.set(0.04, y, z); g.add(stroke);
  }
  for (const dz of [-1.15, 1.15]) {
    const leg = box(0.06, 1.1, 0.06, M(STEEL)); leg.position.set(0, 0.55, dz); g.add(leg);
    const foot = box(0.3, 0.05, 0.12, M(STEEL)); foot.position.set(0, 0.03, dz); g.add(foot);
  }
  return S(g);
}
function buildKanban() {
  const g = new THREE.Group();
  const wall = box(3.7, 1.9, 0.1, M(GLASS_C, { transparent: true, opacity: 0.55, roughness: 0.15 }));
  wall.position.y = 1.35; g.add(wall);
  const header = box(3.7, 0.18, 0.12, M(0x3b82f6)); header.position.y = 2.36; g.add(header);
  const cols = [-1.35, -0.45, 0.45, 1.35];
  const cardColors = [0xfff3b0, 0xbfdbfe, 0xbbf7d0, 0xfecaca, 0xe9d5ff];
  let seed = 7;
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < [3, 4, 2, 3][c]; r++) {
      seed = (seed * 16807) % 2147483647;
      const card = box(0.62, 0.34, 0.03, new THREE.MeshStandardMaterial({ color: cardColors[seed % cardColors.length], roughness: 0.7 }));
      card.position.set(cols[c] + ((seed % 7) - 3) * 0.008, 2.0 - r * 0.45, 0.08);
      card.rotation.z = ((seed % 9) - 4) * 0.008;
      g.add(card);
    }
  }
  return S(g);
}
const gateLamps = [];
function buildGate() {
  const g = new THREE.Group();
  for (const dz of [-0.55, 0.55]) {
    const pillar = box(0.32, 1.15, 0.5, M(STEEL, { metalness: 0.45, roughness: 0.3 }));
    pillar.position.set(0, 0.58, dz); g.add(pillar);
    const lamp = box(0.34, 0.05, 0.1, new THREE.MeshBasicMaterial({ color: 0x34d399 }));
    lamp.position.set(0, 1.18, dz); g.add(lamp);
    gateLamps.push(lamp);
  }
  const flap = box(0.05, 0.5, 0.6, M(GLASS_C, { transparent: true, opacity: 0.6, roughness: 0.1 }));
  flap.position.set(0, 0.75, 0); g.add(flap);
  return S(g);
}
function setGateAlarm(on) {
  for (const lamp of gateLamps) lamp.material.color.setHex(on ? 0xef4444 : 0x34d399);
}
// ---------- new zones: council chamber, agenda board, design board ----------
function buildCouncil() {
  const g = new THREE.Group();
  const top = cyl(1.5, 0.09, M(WHITE, { roughness: 0.25 }), 32); top.position.y = 0.76; g.add(top);
  const leg = cyl(0.14, 0.72, M(STEEL), 16); leg.position.y = 0.36; g.add(leg);
  const holo = cyl(0.55, 0.02, new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.35 }), 32);
  holo.position.y = 0.83; g.add(holo);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const chair = box(0.42, 0.5, 0.42, M(0xe6ebf1, { roughness: 0.5 }));
    chair.position.set(Math.cos(a) * 2.1, 0.25, Math.sin(a) * 2.1);
    chair.rotation.y = -a + Math.PI / 2;
    g.add(chair);
    const back = box(0.42, 0.55, 0.08, M(0xe6ebf1, { roughness: 0.5 }));
    back.position.set(Math.cos(a) * 2.29, 0.68, Math.sin(a) * 2.29);
    back.rotation.y = -a + Math.PI / 2;
    g.add(back);
  }
  const screen = box(0.08, 1.3, 2.3, M(0x141a24, { roughness: 0.35 }));
  screen.position.set(2.9, 1.55, 0); g.add(screen);
  const glow = box(0.02, 1.1, 2.05, new THREE.MeshBasicMaterial({ color: 0x1f3a5f }));
  glow.position.set(2.85, 1.55, 0); g.add(glow);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.02, 8, 40), new THREE.MeshBasicMaterial({ color: 0x60a5fa }));
  ring.position.set(2.84, 1.55, 0); ring.rotation.y = Math.PI / 2; g.add(ring);
  return S(g);
}
function buildAgenda() {
  const g = new THREE.Group();
  const panel = box(0.06, 1.35, 2.1, M(WHITE, { roughness: 0.25 })); panel.position.y = 1.35; g.add(panel);
  const head = box(0.07, 0.16, 2.1, M(0x8b5cf6)); head.position.y = 2.1; g.add(head);
  const noteColors = [0xe9d5ff, 0xbfdbfe, 0xfde68a, 0xbbf7d0];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const note = box(0.015, 0.28, 0.5, new THREE.MeshStandardMaterial({ color: noteColors[(r * 3 + c) % 4], roughness: 0.7 }));
    note.position.set(0.045, 1.75 - r * 0.42, -0.7 + c * 0.7);
    g.add(note);
  }
  for (const dz of [-0.9, 0.9]) {
    const leg = box(0.06, 1.0, 0.06, M(STEEL)); leg.position.set(0, 0.5, dz); g.add(leg);
  }
  return S(g);
}
function buildDesignBoard() {
  const g = new THREE.Group();
  const panel = box(0.06, 1.4, 2.4, M(WHITE, { roughness: 0.2 })); panel.position.y = 1.4; g.add(panel);
  const head = box(0.07, 0.16, 2.4, M(0x14b8a6)); head.position.y = 2.18; g.add(head);
  const shapes = [[0x93c5fd, 0.5, -0.7, 1.75], [0xf9a8d4, 0.35, 0.1, 1.6], [0x86efac, 0.45, 0.75, 1.8], [0xfcd34d, 0.3, -0.2, 1.15], [0xc4b5fd, 0.4, 0.6, 1.1]];
  for (const [color, s, z, y] of shapes) {
    const sq = box(0.015, s * 0.5, s, new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
    sq.position.set(0.045, y, z); g.add(sq);
  }
  for (const dz of [-1.05, 1.05]) {
    const leg = box(0.06, 1.05, 0.06, M(STEEL)); leg.position.set(0, 0.52, dz); g.add(leg);
  }
  return S(g);
}

// ---------- layout: /api/space drives everything ----------
const CAD = new URLSearchParams(location.search).has("cad");
const zonePickers = [];
const zoneObjects = new Map(); // primitive id → { group, pick, primitive }
let spaceData = null;

const ZONE_OF = {
  desk: "desk", vault: "vault", whiteboard: "whiteboard", "design-board": "whiteboard",
  "kanban-wall": "kanban", "security-gate": "gate", "skills-library": "skills",
  "agenda-board": "agenda", council: "council", lounge: null, elevator: null, decor: null,
};
const PICK_SIZE = {
  desk: [3, 1.6, 2.6], vault: [2.4, 2.6, 2.4], whiteboard: [1.6, 2.4, 3],
  "kanban-wall": [4, 2.6, 1.4], "security-gate": [1.6, 1.6, 2.2], "skills-library": [2.2, 2.4, 2.2],
  "design-board": [1.6, 2.6, 2.8], "agenda-board": [1.8, 2.4, 2.6], council: [6.4, 2.4, 5.6],
  lounge: [3.6, 1.4, 3.2], elevator: [2, 2.6, 2], decor: [1.4, 1.4, 1.4],
};

async function buildDeskInto(g) {
  await placeInto(g, "desk", { targetW: 2.2 });
  await placeInto(g, "chairDesk", { targetH: 0.95, pos: [0, 0, 0.9], rotY: Math.PI });
  await placeInto(g, "computerScreen", { targetH: 0.55, pos: [-0.35, 0, -0.25] });
  await placeInto(g, "computerKeyboard", { targetW: 0.5, pos: [0.3, 0, 0.05] });
}
async function buildSkillsLibInto(g) {
  await placeInto(g, "bookcaseOpen", { targetH: 2.0 });
  await placeInto(g, "books", { targetW: 0.5, pos: [0.5, 0, 0.6], rotY: 0.4 });
}
async function buildLoungeInto(g) {
  await placeInto(g, "rugRounded", { targetW: 3.4 });
  await placeInto(g, "loungeSofa", { targetW: 2.2, pos: [0, 0, -0.4], rotY: Math.PI });
  await placeInto(g, "loungeChair", { targetW: 1.0, pos: [-1.4, 0, 0.3], rotY: 1.2 });
  await placeInto(g, "pottedPlant", { targetH: 1.0, pos: [1.4, 0, 0.7] });
  await placeInto(g, "lampRoundFloor", { targetH: 1.5, pos: [-1.6, 0, -1.0] });
}
const BUILDERS = {
  desk: buildDeskInto,
  "skills-library": buildSkillsLibInto,
  lounge: buildLoungeInto,
  vault: (g) => g.add(buildVault()),
  whiteboard: (g) => g.add(buildWhiteboard()),
  "kanban-wall": (g) => g.add(buildKanban()),
  "security-gate": (g) => g.add(buildGate()),
  "design-board": (g) => g.add(buildDesignBoard()),
  "agenda-board": (g) => g.add(buildAgenda()),
  council: (g) => g.add(buildCouncil()),
};

async function addPrimitive(p) {
  const builder = BUILDERS[p.kind];
  if (!builder) return null;
  const g = new THREE.Group();
  g.position.set(p.position[0], p.position[1] ?? 0, p.position[2]);
  g.rotation.y = p.rotationY ?? 0;
  scene.add(g);
  await builder(g);
  // Label floats above the built content.
  g.updateWorldMatrix(true, true);
  const bb = new THREE.Box3().setFromObject(g);
  const h = Math.max(bb.max.y, 1.2) + 0.4;
  const label = makeLabel(p.label);
  label.position.set(0, h, 0);
  label.visible = false; // hover reveals it
  g.add(label);
  // Invisible pick box: shell navigation (view mode) or drag handle (CAD).
  const size = PICK_SIZE[p.kind] ?? [2, 2, 2];
  const pick = new THREE.Mesh(
    new THREE.BoxGeometry(...size),
    new THREE.MeshBasicMaterial({ visible: false }),
  );
  pick.position.y = size[1] / 2;
  pick.userData.zone = ZONE_OF[p.kind];
  pick.userData.primId = p.id;
  g.add(pick);
  zonePickers.push(pick);
  const entry = { group: g, pick, primitive: p, label };
  zoneObjects.set(p.id, entry);
  return entry;
}

async function buildOffice() {
  spaceData = await fetch("/api/space").then((r) => r.json()).catch(() => null);
  if (!spaceData) { console.warn("no /api/space; empty office"); return; }
  for (const p of spaceData.primitives) await addPrimitive(p);
  buildSlots();
  buildObstacles();
}

// Agent slots derive from the live layout: move a desk in Space CAD and
// agents sit at its new position. Fallbacks match the shipped default layout.
// A slot is { pos:[x,0,z], sit, yaw, seatY, gestures } — sit slots play the
// sitting clip at seatY (chair height) facing yaw; standing slots face yaw
// and occasionally play a one-shot gesture from `gestures` (reach for a
// book, nod at the kanban wall, present at the council screen…).
const spot = (pos, opts = {}) => ({ pos, sit: false, yaw: null, seatY: 0, gestures: null, ...opts });
const SLOTS = {
  desk: [[0,0,1.0],[2.9,0,-0.3],[-0.9,0,0.9],[3.7,0,-1.2],[0.9,0,1.3],[2.1,0,0.3]].map((p) => spot(p)),
  gate: [[3.8,0,1.8],[3.8,0,2.6]].map((p) => spot(p)),
  lounge: [[-1.4,0,3.3],[-2.3,0,3.5],[-1.0,0,4.0]].map((p) => spot(p)),
  council: [],
  browse: [],
  idleWander: [[0.5,0,2.0],[-3.0,0,-1.5],[2.0,0,3.0],[-0.5,0,-2.5]].map((p) => spot(p)),
};
function buildSlots() {
  const world = (entry, off) => {
    entry.group.updateWorldMatrix(true, false);
    const v = entry.group.localToWorld(new THREE.Vector3(off[0], 0, off[2]));
    return [v.x, 0, v.z];
  };
  const yawOf = (entry, localYaw) => entry.group.rotation.y + localYaw;
  const ofKind = (kind) => [...zoneObjects.values()].filter((e) => e.primitive.kind === kind);
  const desks = ofKind("desk");
  if (desks.length) {
    SLOTS.desk = desks.flatMap((e) => [
      // desk chair (chairDesk sits at local [0,0,0.9] facing the desk)
      spot(world(e, [0, 0, 0.95]), { sit: true, seatY: 0.42, yaw: yawOf(e, Math.PI) }),
      spot(world(e, [-1.3, 0, 0.9]), { yaw: yawOf(e, Math.PI) }),
      spot(world(e, [1.3, 0, 1.1]), { yaw: yawOf(e, Math.PI) }),
    ]);
  }
  const gate = ofKind("security-gate")[0];
  if (gate) {
    // blocked agents wait at the gate and gesture "no" at it
    SLOTS.gate = [
      spot(world(gate, [-0.9, 0, 0]), { yaw: yawOf(gate, Math.PI / 2), gestures: ["No"] }),
      spot(world(gate, [-0.9, 0, 0.8]), { yaw: yawOf(gate, Math.PI / 2), gestures: ["No", "Wave"] }),
    ];
  }
  const lounge = ofKind("lounge")[0];
  if (lounge) {
    SLOTS.lounge = [
      // sofa seats (sofa at local [0,0,-0.4], facing the rug)
      spot(world(lounge, [-0.5, 0, -0.35]), { sit: true, seatY: 0.3, yaw: yawOf(lounge, 0) }),
      spot(world(lounge, [0.55, 0, -0.35]), { sit: true, seatY: 0.3, yaw: yawOf(lounge, 0) }),
      // lounge chair at local [-1.4,0,0.3] rotY 1.2
      spot(world(lounge, [-1.4, 0, 0.3]), { sit: true, seatY: 0.3, yaw: yawOf(lounge, 1.2) }),
    ];
  }
  const council = ofKind("council")[0];
  if (council) {
    // First slot leads the meeting: standing at the screen, presenting.
    // Remaining slots sit around the table (the chair at the screen side
    // stays empty — the leader stands there).
    SLOTS.council = [
      spot(world(council, [2.45, 0, 0]), {
        yaw: yawOf(council, -Math.PI / 2),
        gestures: ["Yes", "Wave", "No", "ThumbsUp"],
      }),
    ];
    for (let i = 1; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      SLOTS.council.push(spot(world(council, [Math.cos(a) * 2.05, 0, Math.sin(a) * 2.05]), {
        sit: true, seatY: 0.5,
        yaw: yawOf(council, Math.atan2(-Math.cos(a), -Math.sin(a))),
      }));
    }
  }
  // Browse spots: standing interaction points in front of boards and the
  // skills shelf. Offsets face each model's drawn front (+z for the shelf
  // and kanban wall, +x for the thin board panels).
  const BROWSE = {
    "skills-library": { off: [0, 0, 1.05], yaw: Math.PI, gestures: ["Punch"] },
    "kanban-wall": { off: [0, 0, 0.95], yaw: Math.PI, gestures: ["Yes", "No", "ThumbsUp"] },
    whiteboard: { off: [0.95, 0, 0], yaw: -Math.PI / 2, gestures: ["Yes", "ThumbsUp"] },
    "design-board": { off: [0.95, 0, 0], yaw: -Math.PI / 2, gestures: ["Yes", "No"] },
    "agenda-board": { off: [0.95, 0, 0], yaw: -Math.PI / 2, gestures: ["Yes", "ThumbsUp"] },
  };
  const browse = [];
  for (const [kind, cfg] of Object.entries(BROWSE)) {
    for (const e of ofKind(kind)) {
      browse.push(spot(world(e, cfg.off), { yaw: yawOf(e, cfg.yaw), gestures: cfg.gestures }));
    }
  }
  if (browse.length) {
    SLOTS.browse = browse;
    SLOTS.idleWander = browse; // unknown statuses wander to the boards too
  }
}

// ---------- obstacles: agents steer around furniture ----------
// Circle per primitive, sized to the furniture footprint (tighter than the
// pick box). Lounge/decor stay walkable; an agent whose destination lies
// inside a circle (its own desk chair, a council seat) ignores that circle.
const OBSTACLE_R = {
  desk: 1.15, vault: 1.15, whiteboard: 0.85, "design-board": 0.85,
  "agenda-board": 0.8, "kanban-wall": 1.7, "security-gate": 0.45,
  "skills-library": 0.95, council: 1.7, elevator: 0.9,
};
const obstacles = [];
function buildObstacles() {
  obstacles.length = 0;
  for (const e of zoneObjects.values()) {
    const r = OBSTACLE_R[e.primitive.kind];
    if (!r) continue;
    e.group.updateWorldMatrix(true, false);
    obstacles.push({ x: e.group.position.x, z: e.group.position.z, r });
  }
}

// ---------- robot template (Quaternius, CC0) ----------
let robotTemplate = null; // { scene, clips }
async function loadRobot() {
  try {
    const gltf = await loadGlb("robot");
    robotTemplate = { scene: gltf.scene, clips: gltf.animations };
  } catch (e) {
    console.warn("robot.glb failed; procedural fallback", e);
  }
}
function pickClip(clips, ...names) {
  for (const n of names) {
    const clip = clips.find((c) => c.name.toLowerCase().includes(n.toLowerCase()));
    if (clip) return clip;
  }
  return clips[0] ?? null;
}
function buildRobotFallback(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 16), M(color, { roughness: 0.4 }));
  body.scale.set(1, 1.25, 0.9); body.position.y = 0.42; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 16), M(WHITE, { roughness: 0.3 }));
  head.position.y = 0.92; g.add(head);
  return S(g);
}

// ---------- agents ----------
const agents = new Map();
/** "agentic-workspace-3" → "agentic-workspace". Bots are named <project>-<n>. */
function projectOf(agentId) { return String(agentId || "").replace(/-\d+$/, "") || "agent"; }
// Colour identifies the *project*, not the individual, so a repo's bots read as
// a team at a glance and the filter chips can share their colour. Hashed rather
// than assigned in arrival order, so a bot keeps its colour across restarts.
const PALETTE = Object.values(COLORS);
function agentColor(agentId) {
  const project = projectOf(agentId);
  let hash = 0;
  for (let i = 0; i < project.length; i++) hash = (hash * 31 + project.charCodeAt(i)) >>> 0;
  return PALETTE[hash % PALETTE.length];
}

// True posed height of a skinned rig, from bone world positions.
const _bonePos = new THREE.Vector3();
function skeletonHeight(group) {
  let minY = Infinity, maxY = -Infinity;
  group.traverse((o) => {
    if (o.isSkinnedMesh && o.skeleton) {
      for (const bone of o.skeleton.bones) {
        _bonePos.setFromMatrixPosition(bone.matrixWorld);
        if (_bonePos.y < minY) minY = _bonePos.y;
        if (_bonePos.y > maxY) maxY = _bonePos.y;
      }
    }
  });
  return maxY > minY ? maxY - minY : 0;
}

let deskCursor = 0, gateCursor = 0, loungeCursor = 0, councilCursor = 0, wanderCursor = 0;
function pickSlot(status, entry) {
  switch (status) {
    case "active": case "researching": case "reading":
      return SLOTS.desk[(deskCursor++) % SLOTS.desk.length];
    case "blocked": return SLOTS.gate[(gateCursor++) % SLOTS.gate.length];
    case "review":
      if (SLOTS.council.length) return SLOTS.council[(councilCursor++) % SLOTS.council.length];
      return SLOTS.lounge[(loungeCursor++) % SLOTS.lounge.length];
    case "idle": case "success": {
      // idle agents split between the lounge and browsing the boards/shelf
      const pool = [...SLOTS.lounge, ...SLOTS.browse];
      return pool[(loungeCursor++) % pool.length];
    }
    case "offline": return spot([entry.group.position.x, 0, entry.group.position.z]);
    default: return SLOTS.idleWander[(wanderCursor++) % SLOTS.idleWander.length];
  }
}
// Slots are sticky per status: without this, every WS snapshot re-rolled the
// cursor and agents endlessly shuffled between seats (stand up, walk, sit,
// repeat). A new slot is only assigned when the agent's status changes.
function slotFor(a, entry) {
  if (entry.slot && entry.slotStatus === a.status) return entry.slot;
  entry.slotStatus = a.status;
  entry.slot = pickSlot(a.status, entry);
  return entry.slot;
}

function ensureAgent(a) {
  let entry = agents.get(a.agentId);
  if (!entry) {
    const TARGET_H = 1.6; // meters — reads clearly against 0.74m desks
    let group, mixer = null, actions = {};
    if (robotTemplate) {
      group = SkeletonUtils.clone(robotTemplate.scene);
      // tint: clone materials, blend toward the agent color
      const color = new THREE.Color(agentColor(a.agentId));
      group.traverse((o) => {
        if (o.isMesh || o.isSkinnedMesh) {
          o.castShadow = true;
          o.material = o.material.clone();
          o.material.color.lerp(color, 0.55);
        }
      });
      mixer = new THREE.AnimationMixer(group);
      const idle = pickClip(robotTemplate.clips, "Idle");
      const walk = pickClip(robotTemplate.clips, "Walking", "Walk", "Running");
      const wave = pickClip(robotTemplate.clips, "Wave");
      const sit = pickClip(robotTemplate.clips, "Sitting", "Sit");
      if (idle) { actions.idle = mixer.clipAction(idle); }
      if (walk) { actions.walk = mixer.clipAction(walk); }
      if (wave) { actions.wave = mixer.clipAction(wave); actions.wave.loop = THREE.LoopOnce; }
      if (sit && sit !== idle) {
        // Sit-down is a transition clip — looping it makes the agent bob up
        // and down forever. Play once and hold the final (seated) pose.
        actions.sit = mixer.clipAction(sit);
        actions.sit.loop = THREE.LoopOnce;
        actions.sit.clampWhenFinished = true;
      }
      // One-shot gesture clips for object interactions (grab book, nod at
      // kanban, present at council…). Played over the base pose, they
      // auto-release back to idle when finished.
      actions.gesture = {};
      for (const name of ["Yes", "No", "ThumbsUp", "Punch", "Wave"]) {
        const clip = robotTemplate.clips.find((c) => c.name.endsWith("_" + name));
        if (clip) {
          const act = mixer.clipAction(clip);
          act.loop = THREE.LoopOnce;
          actions.gesture[name] = act;
        }
      }
      actions.idle?.play();
      // Normalize height from the SKELETON, not a bounding box. setFromObject on
      // a skinned mesh returns bind-pose geometry bounds (here ~150 units) while
      // the actual rendered body is only ~3 units — that mismatch shrank robots
      // to specks. Bone world-Y span is the true posed height.
      group.scale.setScalar(1);
      mixer.update(0);
      group.updateWorldMatrix(true, true);
      const boneH = skeletonHeight(group);
      // Head mesh extends ~15% above the top bone; account for it.
      const s = boneH > 1e-3 ? TARGET_H / (boneH * 1.15) : 1;
      group.scale.setScalar(s);
      group.userData.localTop = boneH * 1.15; // pre-scale head height for tag
    } else {
      group = buildRobotFallback(agentColor(a.agentId));
      group.scale.setScalar(TARGET_H / 1.15);
      group.userData.localTop = 1.15;
    }
    const tag = makeLabel(a.agentId, 1.5);
    // tag sits above the head in the group's LOCAL (pre-scale) space.
    tag.position.y = (group.userData.localTop ?? 1.4) * 1.05 + 0.15;
    group.add(tag);
    // card badge below the name tag; text swapped when board state changes
    const cardTag = makeLabel("", 1.9);
    cardTag.position.y = tag.position.y - 0.35;
    cardTag.visible = false;
    group.add(cardTag);
    group.userData.cardTag = cardTag;
    group.userData.agentId = a.agentId;
    scene.add(group);
    entry = { group, mixer, actions, mode: "idle", target: new THREE.Vector3(0,0,0), data: a };
    agents.set(a.agentId, entry);
  }
  const prevStatus = entry.data?.status;
  entry.data = a;
  applyVisibility(entry);
  const slot = slotFor(a, entry);
  entry.seat = slot.sit ? slot : null;
  entry.faceYaw = slot.yaw;
  entry.target.fromArray(slot.pos);
  if (a.status === "success" && prevStatus !== "success" && entry.actions.wave) {
    entry.actions.wave.reset().play();
  }
  return entry;
}
// ---------- project filter ----------
// One office, many repos. Rather than partition the floor, hide the crews you
// aren't watching — the same move the kanban already makes with tags.
const filterBar = document.getElementById("filterbar");
let projectFilter = PARAMS.get("project") || null; // null = show every project

/** Offline agents leave the floor; filtered-out projects are hidden with them. */
function applyVisibility(entry) {
  const live = entry.data?.status !== "offline";
  const shown = !projectFilter || projectOf(entry.data?.agentId) === projectFilter;
  entry.group.visible = live && shown;
}

function setProjectFilter(project) {
  projectFilter = project;
  for (const entry of agents.values()) applyVisibility(entry);
  renderFilterBar();
  updateCount();
}

function renderFilterBar() {
  if (MINI) return; // the overview widget is too small to filter in
  const counts = new Map();
  for (const entry of agents.values()) {
    if (entry.data?.status === "offline") continue;
    const project = projectOf(entry.data?.agentId);
    counts.set(project, (counts.get(project) ?? 0) + 1);
  }
  // A filtered-away project keeps its chip, otherwise clearing the filter means
  // hunting for a control that just vanished.
  if (projectFilter && !counts.has(projectFilter)) counts.set(projectFilter, 0);
  // A single project needs no filter — chips would be decoration. But never
  // hide the bar while a filter is on, or the last agent of the filtered
  // project leaving strands you in an empty room with no way back.
  if (counts.size < 2 && !projectFilter) {
    filterBar.style.display = "none";
    filterBar.replaceChildren();
    return;
  }

  const chips = [["", "All", [...counts.values()].reduce((a, b) => a + b, 0)]];
  for (const project of [...counts.keys()].sort()) chips.push([project, project, counts.get(project)]);

  filterBar.replaceChildren(...chips.map(([value, label, n]) => {
    const btn = document.createElement("button");
    btn.className = "chip" + ((projectFilter ?? "") === value ? " on" : "");
    btn.textContent = label;
    const count = document.createElement("span");
    count.className = "n";
    count.textContent = String(n);
    btn.appendChild(count);
    btn.onclick = () => setProjectFilter(value || null);
    return btn;
  }));
  filterBar.style.display = "flex";
}

function updateCount() {
  const shown = [...agents.values()].filter((e) => e.group.visible).length;
  countEl.textContent = projectFilter ? `${shown} agents in ${projectFilter}` : `${shown} agents`;
}

/**
 * Despawns a bot's robot. Sessions end, and without this the floor fills with
 * ghosts of finished work until someone reloads the page.
 */
function removeAgent(agentId) {
  const entry = agents.get(agentId);
  if (!entry) return;
  entry.mixer?.stopAllAction();
  scene.remove(entry.group);
  entry.group.traverse((o) => {
    if (!o.isMesh && !o.isSkinnedMesh && !o.isSprite) return;
    o.geometry?.dispose?.();
    for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
      m?.map?.dispose?.();
      m?.dispose?.();
    }
  });
  agents.delete(agentId);
  cardsByAgent.delete(agentId);
  renderFilterBar();
  updateCount();
}

function setMode(entry, mode) {
  if (entry.mode === mode || !entry.mixer) { entry.mode = mode; return; }
  const from = entry.actions[entry.mode], to = entry.actions[mode];
  if (to) { to.reset().fadeIn(0.2).play(); from?.fadeOut(0.2); }
  entry.mode = mode;
}

// ---------- board cards on desks ----------
const cardsByAgent = new Map(); // agentId → card (in_progress only)
function applyCard(card) {
  // Drop stale ownership of this card first.
  for (const [aid, c] of cardsByAgent) if (c.id === card.id) cardsByAgent.delete(aid);
  const owner = card.assignee;
  if (owner && card.status === "in_progress") cardsByAgent.set(owner, card);
  refreshCardTags();
}
function refreshCardTags() {
  for (const [agentId, entry] of agents) {
    const tag = entry.group.userData.cardTag;
    if (!tag) continue;
    const card = cardsByAgent.get(agentId);
    const text = card ? `${card.key} · ${card.progress}%` : "";
    if (tag.userData.text === text) continue;
    tag.userData.text = text;
    tag.visible = text !== "";
    if (text) {
      const fresh = makeLabel(text, 1.9);
      tag.material.map?.dispose();
      tag.material.map = fresh.material.map;
      tag.material.needsUpdate = true;
    }
  }
}

const panel = document.getElementById("panel");
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const groundHit = new THREE.Vector3();

function castPointer(e) {
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);

function snap(v) {
  const grid = spaceData?.room?.gridSize ?? 0.5;

    #cadbar button, #cadbar select { border:1px solid #d5dce4; background:#f6f8fa; border-radius:8px;
      padding:7px 14px; font-weight:600; cursor:pointer; font-size:13px; color:#1f2937; flex-shrink:0; }
    #cadbar select { padding:7px 10px; }
    #cadbar button:hover { background:#eef1f5; }
    #cadbar #cad-save { background:#3b82f6; border-color:#3b82f6; color:#fff; }
    #cadbar #cad-save:hover { background:#2f6fe0; }
    #cadbar #cad-state { font-size:12px; font-weight:600; color:#16a34a; margin-left:auto; }
    #cad-inspector { position:fixed; right:12px; top:12px; width:230px; background:#fff;
      border:1px solid #dde3ea; border-radius:10px; padding:12px 14px; z-index:10; display:none;
      box-shadow:0 6px 18px rgba(30,40,60,.1); }
    #cad-inspector h4 { margin:0 0 8px; font-size:12px; }
    #cad-inspector label { display:block; font-size:11px; color:#68758a; margin-bottom:8px; }
    #cad-inspector input, #cad-inspector select { width:100%; border:1px solid #dde3ea;
      border-radius:6px; padding:5px 8px; font-size:12px; margin-top:2px; box-sizing:border-box; }`;
  document.head.appendChild(style);

  const refreshLabel = (entry) => {
    // Rebuild the label sprite texture with the new text.
    const fresh = makeLabel(entry.primitive.label);
    entry.label.material.map?.dispose();
    entry.label.material.map = fresh.material.map;
    entry.label.material.needsUpdate = true;
  };
  document.getElementById("cad-i-label").oninput = (e) => {
    if (!selected) return;
    selected.primitive.label = e.target.value;
    refreshLabel(selected);
    markDirty();
  };
  document.getElementById("cad-i-btype").onchange = (e) => {
    if (!selected) return;
    selected.primitive.binding = { type: e.target.value, target: selected.primitive.binding?.target ?? "" };
    markDirty();
  };
  document.getElementById("cad-i-btarget").oninput = (e) => {
    if (!selected) return;
    selected.primitive.binding = { type: selected.primitive.binding?.type ?? "none", target: e.target.value };
    markDirty();
  };

  const freshId = (kind) => `${kind}-${Date.now().toString(36)}${Math.floor(Math.random() * 36).toString(36)}`;
  document.getElementById("cad-add").onclick = async () => {
    const kind = document.getElementById("cad-kind").value;
    if (!BUILDERS[kind]) return;
    const p = {
      id: freshId(kind), kind, label: kind.replace(/-/g, " "),
      position: [2.5, 0, 0], rotationY: 0,
      scale: [1, 1, 1], binding: { type: "none", target: "" },
    };
    const entry = await addPrimitive(p);
    if (!entry) return;
    spaceData.primitives.push(p);
    setSelected(entry);
    markDirty();
  };
  document.getElementById("cad-dup").onclick = async () => {
    if (!selected) return;
    const src = selected.primitive;
    const p = JSON.parse(JSON.stringify(src));
    p.id = freshId(p.kind);
    p.position = [snap(src.position[0] + 1.5), 0, snap(src.position[2] + 1.5)];
    spaceData.primitives.push(p);
    setSelected(await addPrimitive(p));
    markDirty();
  };
  const deleteSelected = () => {
    if (!selected) return;
    const { group, pick, primitive } = selected;
    selectRing?.parent?.remove(selectRing);
    scene.remove(group);
    zonePickers.splice(zonePickers.indexOf(pick), 1);
    zoneObjects.delete(primitive.id);
    spaceData.primitives = spaceData.primitives.filter((x) => x.id !== primitive.id);
    setSelected(null);
    markDirty();
  };
  document.getElementById("cad-del").onclick = deleteSelected;

  document.getElementById("cad-save").onclick = async () => {
    for (const { group, primitive } of zoneObjects.values()) {
      primitive.position = [group.position.x, 0, group.position.z];
      primitive.rotationY = group.rotation.y;
    }
    const res = await fetch("/api/space", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(spaceData),
    });
    cadDirty = false;
    document.getElementById("cad-state").textContent = res.ok ? "saved ✓" : "save failed";
  };
  document.getElementById("cad-reset").onclick = () => location.reload();

  addEventListener("pointermove", (e) => {
    if (!dragging) return;
    castPointer(e);
    if (ray.ray.intersectPlane(groundPlane, groundHit)) {
      dragging.entry.group.position.x = snap(groundHit.x - dragging.offset.x);
      dragging.entry.group.position.z = snap(groundHit.z - dragging.offset.z);
      markDirty();
    }
  });
  addEventListener("pointerup", () => { dragging = null; });
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key.toLowerCase() === "r" && selected) {
      selected.group.rotation.y += Math.PI / 12;
      markDirty();
    } else if ((e.key === "Delete" || e.key === "Backspace") && selected) {
      deleteSelected();
    } else if (e.key === "Escape") {
      setSelected(null);
    }
  });
  addEventListener("beforeunload", (e) => { if (cadDirty) e.preventDefault(); });
}

// ---------- zoom (wheel / trackpad pinch) ----------
addEventListener("wheel", (e) => {
  if (e.target.closest?.("#cadbar, #cad-inspector, #panel, #approvals")) return;
  e.preventDefault();
  camera.zoom = Math.min(3.5, Math.max(0.45, camera.zoom * Math.exp(-e.deltaY * 0.0012)));
  camera.updateProjectionMatrix();
}, { passive: false });

// ---------- hover: reveal zone labels ----------
let hoverEntry = null;
function setHover(entry) {
  if (hoverEntry === entry) return;
  if (hoverEntry) hoverEntry.label.visible = CAD && selected === hoverEntry;
  hoverEntry = entry;
  if (entry) entry.label.visible = true;
  renderer.domElement.style.cursor = entry ? "pointer" : "default";
}
addEventListener("pointermove", (e) => {
  if (orbiting) {
    camAzimuth = orbiting.startAz - (e.clientX - orbiting.startX) * 0.005;
    applyCamera();
    return;
  }
  if (dragging) return;
  if (e.target !== renderer.domElement) { setHover(null); return; }
  castPointer(e);
  const hits = ray.intersectObjects(zonePickers, false);
  const id = hits[0]?.object.userData.primId;
  setHover(id ? zoneObjects.get(id) ?? null : null);
});
addEventListener("pointerup", () => { orbiting = null; });
addEventListener("contextmenu", (e) => {
  if (e.target === renderer.domElement) e.preventDefault();
});

addEventListener("pointerdown", (e) => {
  if (e.target.closest?.("#cadbar, #cad-inspector")) return;
  // Right or middle button always orbits (both modes).
  if (e.button === 1 || e.button === 2) {
    orbiting = { startX: e.clientX, startAz: camAzimuth };
    return;
  }
  castPointer(e);
  if (CAD) {
    const zoneHits = ray.intersectObjects(zonePickers, false);
    const primId = zoneHits[0]?.object.userData.primId;
    const entry = primId ? zoneObjects.get(primId) : null;
    setSelected(entry ?? null);
    if (entry && ray.ray.intersectPlane(groundPlane, groundHit)) {
      dragging = {
        entry,
        offset: new THREE.Vector3(groundHit.x - entry.group.position.x, 0, groundHit.z - entry.group.position.z),
      };
    }
    return;
  }
  const hits = ray.intersectObjects([...agents.values()].map((x) => x.group), true);
  let node = hits[0]?.object;
  while (node && !node.userData.agentId) node = node.parent;
  const id = node?.userData?.agentId;
  if (!id) {
    // No agent hit — check zone hotspots, notify the shell.
    const zoneHits = ray.intersectObjects(zonePickers, false);
    const zone = zoneHits[0]?.object.userData.zone;
    if (zone) {
      if (EMBED && window.parent !== window) {
        window.parent.postMessage({ type: "aura:zone", zone }, "*");
      }
      panel.style.display = "none";
      return;
    }
  }
  if (id && agents.has(id)) {
    const a = agents.get(id).data;
    const tok = (a.tokens.input + a.tokens.output).toLocaleString();
    const card = cardsByAgent.get(a.agentId);
    panel.style.display = "block";
    panel.innerHTML = `<h3>${a.agentId}</h3>
      <div class="row"><span>STATUS</span><span>${a.status}</span></div>
      <div class="row"><span>TASK</span><span>${a.task || "—"}</span></div>
      <div class="row"><span>CARD</span><span>${card ? `${card.key} · ${card.progress}%` : "—"}</span></div>
      <div class="row"><span>TOKENS</span><span>${tok}</span></div>
      <div class="row"><span>SESSION</span><span>${a.sessionId.slice(0,8)}</span></div>`;
  } else {
    panel.style.display = "none";
    // Left-drag on empty floor swivels the view.
    orbiting = { startX: e.clientX, startAz: camAzimuth };
  }
});

// ---------- approvals ----------
const approvals = new Map();
const approvalsEl = document.getElementById("approvals");
function renderApprovals() {
  approvalsEl.innerHTML = "";
  for (const r of approvals.values()) {
    const el = document.createElement("div");
    el.className = "ar";
    el.innerHTML = `<div class="h"><span class="agent">${r.agentId}</span><span class="tool">${r.tool}</span></div>
      <div class="tool">${(r.inputPreview || "").slice(0, 90)}</div>
      <div class="reason">${r.reason} · impact: ${r.impact}</div>
      <div class="btns"><button class="approve">Approve &amp; Execute</button><button class="deny">Deny</button></div>`;
    el.querySelector(".approve").onclick = () => resolveApproval(r.id, true);
    el.querySelector(".deny").onclick = () => resolveApproval(r.id, false);
    approvalsEl.appendChild(el);
  }
  setGateAlarm(approvals.size > 0);
}
async function resolveApproval(id, approved) {
  approvals.delete(id); renderApprovals();
  await fetch(`/api/approvals/${id}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved }),
  }).catch(() => {});
}

// ---------- live data ----------
const connEl = document.getElementById("conn");
const countEl = document.getElementById("count");
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { connEl.textContent = "live"; };
  ws.onclose = () => { connEl.textContent = "reconnecting…"; setTimeout(connect, 1500); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.kind === "hello") {
      msg.agents.forEach(ensureAgent);
      (msg.approvals || []).forEach((r) => approvals.set(r.id, r));
      renderApprovals();
      fetch("/api/board/cards").then((r) => r.json())
        .then((d) => d.cards.forEach(applyCard)).catch(() => {});
    } else if (msg.kind === "snapshot") { ensureAgent(msg.agent); refreshCardTags(); }
    else if (msg.kind === "agent.removed") removeAgent(msg.agentId);
    else if (msg.kind === "card.upsert") applyCard(msg.card);
    else if (msg.kind === "card.removed") {
      for (const [aid, c] of cardsByAgent) if (c.id === msg.id) cardsByAgent.delete(aid);
      refreshCardTags();
    }
    else if (msg.kind === "approval.pending") { approvals.set(msg.request.id, msg.request); renderApprovals(); }
    else if (msg.kind === "approval.resolved") { approvals.delete(msg.id); renderApprovals(); }
    else if (msg.kind === "space.updated" && !CAD) location.reload();
    renderFilterBar();
    updateCount();
  };
}

window.__aura = {
  agents, scene, zoneObjects, camera, obstacles, get spaceData() { return spaceData; },
  worldHeight(id) {
    const e = agents.get(id); if (!e) return null;
    e.group.updateWorldMatrix(true, true);
    return +new THREE.Box3().setFromObject(e.group).getSize(new THREE.Vector3()).y.toFixed(3);
  },
  bodyHeight(id) {
    const e = agents.get(id); if (!e) return null;
    e.group.updateWorldMatrix(true, true);
    return +skeletonHeight(e.group).toFixed(3);
  },
};

// ---------- boot ----------
await Promise.all([buildOffice(), loadRobot()]);
connect();

// ---------- loop ----------
const clock = new THREE.Clock();
// Stop rendering when the canvas isn't visible (e.g. hidden shell iframe) —
// two live WebGL loops otherwise fight for the GPU.
let renderOn = true;
new IntersectionObserver((entries) => { renderOn = entries[0].isIntersecting; })
  .observe(renderer.domElement);
const WALK_SPEED = 1.7; // m/s
function tick() {
  if (!renderOn) { requestAnimationFrame(tick); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const entry of agents.values()) {
    const p = entry.group.position;
    const t = entry.target;
    const dist = Math.hypot(t.x - p.x, t.z - p.z);
    if (dist > 0.06) {
      const step = Math.min(dist, WALK_SPEED * dt);
      const dx = (t.x - p.x) / dist, dz = (t.z - p.z) / dist;
      let nx = p.x + dx * step, nz = p.z + dz * step;
      // Steer around furniture: if the next step lands inside an obstacle
      // circle, push out to its rim and slide along the tangent. Obstacles
      // containing the destination (own chair) are ignored.
      for (const o of obstacles) {
        const tdx = t.x - o.x, tdz = t.z - o.z;
        if (tdx * tdx + tdz * tdz < o.r * o.r) continue;
        const ox = nx - o.x, oz = nz - o.z;
        const d2 = ox * ox + oz * oz;
        if (d2 < o.r * o.r && d2 > 1e-6) {
          const d = Math.sqrt(d2);
          let tx = -oz / d, tz = ox / d; // tangent, pick the side we're heading
          if (tx * dx + tz * dz < 0) { tx = -tx; tz = -tz; }
          nx = o.x + (ox / d) * o.r + tx * step;
          nz = o.z + (oz / d) * o.r + tz * step;
        }
      }
      entry.group.rotation.y = Math.atan2(nx - p.x, nz - p.z);
      p.x = nx; p.z = nz;
      p.y += (0 - p.y) * Math.min(1, dt * 6);
      entry.nextGesture = null;
      if (entry.activeGesture) { entry.activeGesture.fadeOut(0.2); entry.activeGesture = null; }
      setMode(entry, "walk");
    } else {
      const seat = entry.seat;
      if (seat && entry.actions.sit) {
        // settle onto the chair: face the desk/table, ease up to seat height
        if (entry.faceYaw != null) {
          let dy = entry.faceYaw - entry.group.rotation.y;
          dy = Math.atan2(Math.sin(dy), Math.cos(dy));
          entry.group.rotation.y += dy * Math.min(1, dt * 6);
        }
        p.y += (seat.seatY - p.y) * Math.min(1, dt * 6);
        setMode(entry, "sit");
      } else {
        if (entry.faceYaw != null) {
          let dy = entry.faceYaw - entry.group.rotation.y;
          dy = Math.atan2(Math.sin(dy), Math.cos(dy));
          entry.group.rotation.y += dy * Math.min(1, dt * 6);
        }
        p.y += (0 - p.y) * Math.min(1, dt * 6);
        setMode(entry, "idle");
        // Settled at an interaction spot: every so often play a one-shot
        // gesture (grab a book, nod at the board, present at the screen).
        // Idle fades out for the gesture and back in when it ends.
        const now = performance.now();
        if (entry.activeGesture && now >= entry.gestureUntil) {
          entry.activeGesture = null;
          entry.actions.idle?.reset().fadeIn(0.2).play();
        }
        const g = entry.slot?.gestures;
        if (g?.length && entry.actions.gesture && !entry.activeGesture) {
          entry.nextGesture ??= now + 2000 + Math.random() * 6000;
          if (now >= entry.nextGesture) {
            entry.nextGesture = now + 6000 + Math.random() * 10000;
            const act = entry.actions.gesture[g[Math.floor(Math.random() * g.length)]];
            if (act) {
              act.reset().fadeIn(0.15).play();
              entry.actions.idle?.fadeOut(0.15);
              entry.activeGesture = act;
              entry.gestureUntil = now + act.getClip().duration * 1000 - 150;
            }
          }
        }
      }
    }
    entry.mixer?.update(dt);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener("resize", () => {
  const a2 = innerWidth / innerHeight;
  camera.left = -D*a2; camera.right = D*a2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clock.stop(); else clock.start();
});
</script>
</body>
