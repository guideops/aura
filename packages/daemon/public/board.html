<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA — board</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f9; --card:#fff; --line:#e3e8ef; --tx:#1f2733; --dim:#6b7688; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--tx); }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); background:#fff; }
  header b { letter-spacing:.14em; }
  header .dim { color:var(--dim); font-size:12px; }
  header .grow { flex:1; }
  header input { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; width:240px; }
  header button { border:0; background:#2563eb; color:#fff; border-radius:8px; padding:7px 14px; font-weight:600; cursor:pointer; }
  main { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:16px; align-items:start; }
  .col { background:#eef1f5; border:1px solid var(--line); border-radius:12px; padding:10px; min-height:200px; }
  .col.drop { outline:2px dashed #2563eb; outline-offset:-4px; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:2px 4px 10px; display:flex; justify-content:space-between; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:9px; cursor:grab; box-shadow:0 1px 2px rgba(20,30,50,.04); }
  .card:active { cursor:grabbing; }
  .card .key { font-family:ui-monospace,monospace; font-size:11px; color:var(--dim); }
  .card .title { font-weight:600; margin:2px 0 8px; }
  .card .meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tag { font-size:10px; background:#eef2ff; color:#4f46e5; border-radius:20px; padding:1px 8px; }
  .assignee { font-size:11px; display:flex; align-items:center; gap:4px; color:var(--dim); margin-left:auto; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .bar { height:5px; background:#eef1f5; border-radius:4px; margin-top:8px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:#2563eb; }
  .tag.skill { background:#ecfdf5; color:#059669; }
  dialog { border:1px solid var(--line); border-radius:12px; padding:18px; width:360px; box-shadow:0 12px 40px rgba(20,30,50,.18); }
  dialog::backdrop { background:rgba(20,30,50,.35); }
  dialog h3 { margin:0 0 12px; font-size:14px; }
  dialog label { display:block; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin:10px 0 4px; }
  dialog input[type=text] { width:100%; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; }
  .skill-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; }
  .skill-row .desc { color:var(--dim); font-size:11px; }
  dialog menu { display:flex; justify-content:flex-end; gap:8px; margin:16px 0 0; padding:0; }
  dialog button { border:0; border-radius:8px; padding:7px 14px; font-weight:600; cursor:pointer; }
  dialog .primary { background:#2563eb; color:#fff; }
  dialog .ghost { background:#eef1f5; color:var(--tx); }
</style>
</head>
<body>
<header>
  <b>AURA</b><span class="dim">board · <span id="conn">connecting…</span></span>
  <span class="grow"></span>
  <input id="new" placeholder="New card title… (Enter)" />
</header>
<main id="board"></main>
<dialog id="assign">
  <h3 id="assign-title">Assign card</h3>
  <label for="assign-agent">Agent id</label>
  <input type="text" id="assign-agent" placeholder="blue-1 (optional)" />
  <label for="assign-cwd">Working directory (spawns session)</label>
  <input type="text" id="assign-cwd" placeholder="C:\path\to\repo (optional)" />
  <label>Skills</label>
  <div id="assign-skills"><span class="desc">none registered</span></div>
  <menu>
    <button class="ghost" id="assign-cancel">Cancel</button>
    <button class="primary" id="assign-go">Assign</button>
  </menu>
</dialog>
<script type="module">
const COLS = [
  { status: "backlog", title: "Backlog" },
  { status: "in_progress", title: "In Progress" },
  { status: "review", title: "Review" },
  { status: "done", title: "Done" },
];
const AGENT_COLORS = { blue:"#3b82f6", green:"#22c55e", orange:"#f97316", purple:"#8b5cf6", red:"#ef4444", yellow:"#eab308" };
const cards = new Map();
const boardEl = document.getElementById("board");
const connEl = document.getElementById("conn");

function agentDot(assignee) {
  if (!assignee) return "";
  const c = AGENT_COLORS[assignee.split("-")[0]] ?? "#64748b";
  return `<span class="assignee"><span class="dot" style="background:${c}"></span>${assignee}</span>`;
}
let skillNames = new Set();
let skillList = [];
function cardHTML(c) {
  const tags = c.tags.map((t) =>
    `<span class="tag${skillNames.has(t) ? " skill" : ""}">${skillNames.has(t) ? "⚡" : ""}${escapeHtml(t)}</span>`,
  ).join("");
  const bar = c.progress > 0 ? `<div class="bar"><i style="width:${c.progress}%"></i></div>` : "";
  return `<div class="card" draggable="true" data-id="${c.id}">
    <div class="key">${c.key}</div>
    <div class="title">${escapeHtml(c.title)}</div>
    <div class="meta">${tags}${agentDot(c.assignee)}</div>${bar}
  </div>`;
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, (m)=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m])); }

function render() {
  boardEl.innerHTML = "";
  for (const col of COLS) {
    const list = [...cards.values()].filter((c) => c.status === col.status);
    const el = document.createElement("div");
    el.className = "col"; el.dataset.status = col.status;
    el.innerHTML = `<h2>${col.title}<span>${list.length}</span></h2>` + list.map(cardHTML).join("");
    boardEl.appendChild(el);
  }
  wireDnD();
}

function wireDnD() {
  let dragId = null;
  for (const card of boardEl.querySelectorAll(".card")) {
    card.addEventListener("dragstart", (e) => { dragId = card.dataset.id; e.dataTransfer.effectAllowed = "move"; });
    card.addEventListener("dblclick", () => openAssign(card.dataset.id));
  }
  for (const col of boardEl.querySelectorAll(".col")) {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", () => col.classList.remove("drop"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault(); col.classList.remove("drop");
      if (!dragId) return;
      const status = col.dataset.status;
      const c = cards.get(dragId);
      if (c && c.status !== status) {
        c.status = status; render(); // optimistic
        await fetch(`/api/board/cards/${dragId}`, {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status }),
        }).catch(() => {});
      }
      dragId = null;
    });
  }
}

document.getElementById("new").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const title = e.target.value.trim(); e.target.value = "";
  await fetch("/api/board/cards", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }),
  }).catch(() => {});
});

const assignDlg = document.getElementById("assign");
let assignCardId = null;
function openAssign(id) {
  const c = cards.get(id);
  if (!c) return;
  assignCardId = id;
  document.getElementById("assign-title").textContent = `Assign ${c.key} — ${c.title}`;
  document.getElementById("assign-agent").value = c.assignee ?? "";
  const skillsEl = document.getElementById("assign-skills");
  if (skillList.length) {
    skillsEl.innerHTML = skillList.map((s) => `
      <label class="skill-row"><input type="checkbox" value="${escapeHtml(s.meta.name)}"
        ${c.tags.includes(s.meta.name) ? "checked" : ""}/>
        ⚡${escapeHtml(s.meta.name)} <span class="desc">${escapeHtml(s.meta.description)}</span></label>`).join("");
  } else {
    skillsEl.innerHTML = '<span class="desc">none registered</span>';
  }
  assignDlg.showModal();
}
document.getElementById("assign-cancel").addEventListener("click", () => assignDlg.close());
document.getElementById("assign-go").addEventListener("click", async () => {
  const body = {};
  const agentId = document.getElementById("assign-agent").value.trim();
  const cwd = document.getElementById("assign-cwd").value.trim();
  if (agentId) body.agentId = agentId;
  if (cwd) body.cwd = cwd;
  const picked = [...document.querySelectorAll("#assign-skills input:checked")].map((i) => i.value);
  if (picked.length) body.skills = picked;
  const res = await fetch(`/api/board/cards/${assignCardId}/assign`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) { alert((await res.json()).error ?? res.status); return; }
  assignDlg.close();
});

async function boot() {
  const [res, sk] = await Promise.all([
    fetch("/api/board/cards").then((r) => r.json()),
    fetch("/api/skills").then((r) => r.json()).catch(() => ({ skills: [] })),
  ]);
  skillList = sk.skills;
  skillNames = new Set(skillList.map((s) => s.meta.name));
  for (const c of res.cards) cards.set(c.id, c);
  render();
  connect();
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { connEl.textContent = "live"; };
  ws.onclose = () => { connEl.textContent = "reconnecting…"; setTimeout(connect, 1500); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.kind === "card.upsert") { cards.set(msg.card.id, msg.card); render(); }
    else if (msg.kind === "card.removed") { cards.delete(msg.id); render(); }
  };
}
window.__auraBoard = { cards };
boot();
</script>
</body>
</html>
