<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA — vault graph</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --card:#161b22; --line:#242c37; --tx:#dbe2ea; --dim:#8b98a9; --accent:#7fb8ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; background:var(--bg); color:var(--tx); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header b { font-size:15px; letter-spacing:.14em; }
  header span, header a { color:var(--dim); text-decoration:none; }
  header a:hover { color:var(--accent); }
  main { display:grid; grid-template-columns: 1fr 380px; height:calc(100vh - 46px); }
  #canvas { display:block; width:100%; height:100%; cursor:grab; }
  aside { border-left:1px solid var(--line); overflow-y:auto; padding:12px; }
  aside h2 { margin:0 0 8px; font-size:13px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
  #note { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; min-height:120px; white-space:pre-wrap; word-break:break-word; }
  #note .hint { color:var(--dim); }
  textarea { width:100%; box-sizing:border-box; background:var(--card); border:1px solid var(--line); border-radius:8px; color:var(--tx); padding:8px 10px; font:12px/1.5 ui-monospace, monospace; min-height:160px; resize:vertical; }
  .btnrow { display:flex; gap:8px; margin:8px 0 16px; }
  button { border:0; border-radius:8px; padding:6px 12px; font:inherit; font-weight:600; cursor:pointer; background:#2563eb; color:#fff; }
  button.ghost { background:#242c37; color:var(--tx); }
  button.danger { background:#7f1d1d; color:#fecaca; }
  input[type=text] { background:var(--card); border:1px solid var(--line); border-radius:8px; color:var(--tx); padding:6px 10px; font:inherit; }
  .msg { font-size:11px; min-height:1.4em; color:var(--dim); }
  .msg.err { color:#ff7b8a; }
  .msg.ok { color:#5ee0a0; }
  .skill { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:8px; }
  .skill b { color:var(--accent); }
  .skill .meta { color:var(--dim); font-size:11px; }
  .tag { display:inline-block; padding:0 6px; border:1px solid var(--line); border-radius:8px; font-size:10px; margin-right:4px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <b>AURA</b><span>vault graph</span>
  <a href="/index.html">console</a><a href="/board.html">board</a><a href="/office.html">office</a>
  <span id="stats"></span>
</header>
<main>
  <canvas id="canvas"></canvas>
  <aside>
    <h2>Note</h2>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="text" id="note-slug" placeholder="slug (e.g. projects/idea)" style="flex:1" />
      <button class="ghost" id="note-new">new</button>
    </div>
    <textarea id="note-edit" placeholder="click a node or type a slug, then write markdown…"></textarea>
    <div class="btnrow"><button id="note-save">save note</button><span class="msg" id="note-msg"></span></div>
    <h2>Skills</h2>
    <div id="skills"><span class="hint">loading…</span></div>
    <div style="display:flex;gap:8px;margin:8px 0">
      <input type="text" id="skill-name" placeholder="skill name (kebab-case)" style="flex:1" />
      <button class="ghost" id="skill-load">load</button>
    </div>
    <textarea id="skill-edit" placeholder="---&#10;name: my-skill&#10;description: what it does&#10;---&#10;&#10;# my-skill&#10;## Steps"></textarea>
    <div class="btnrow">
      <button id="skill-save">save skill</button>
      <button class="danger" id="skill-delete">delete</button>
      <span class="msg" id="skill-msg"></span>
    </div>
  </aside>
</main>
<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const statsEl = document.getElementById("stats");
  const noteSlug = document.getElementById("note-slug");
  const noteEdit = document.getElementById("note-edit");
  const noteMsg = document.getElementById("note-msg");
  const say = (el, text, cls) => { el.textContent = text; el.className = "msg " + (cls || ""); };

  let nodes = [], edges = [], selected = null;
  let dragNode = null, panning = false, px = 0, py = 0;
  let offsetX = 0, offsetY = 0, scale = 1;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);

  async function load() {
    const g = await fetch("/api/vault/graph").then((r) => r.json());
    const w = canvas.clientWidth, h = canvas.clientHeight;
    // Keep positions of surviving nodes so live refreshes don't scramble the layout.
    const prev = new Map(nodes.map((n) => [n.id, n]));
    const byId = new Map();
    nodes = g.nodes.map((n, i) => {
      const old = prev.get(n.id);
      const angle = (i / Math.max(g.nodes.length, 1)) * Math.PI * 2;
      const node = {
        ...n,
        x: old ? old.x : w / 2 + Math.cos(angle) * Math.min(w, h) / 3,
        y: old ? old.y : h / 2 + Math.sin(angle) * Math.min(w, h) / 3,
        vx: 0, vy: 0, degree: 0,
      };
      byId.set(n.id, node);
      return node;
    });
    if (selected) selected = byId.get(selected.id) ?? null;
    edges = g.edges
      .map((e) => ({ from: byId.get(e.from), to: byId.get(e.to) }))
      .filter((e) => e.from && e.to);
    for (const e of edges) { e.from.degree++; e.to.degree++; }
    statsEl.textContent = `${nodes.length} notes · ${edges.length} links`;
  }

  // Simple force layout: spring edges, coulomb repulsion, mild centering.
  function step() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy || 1;
        const f = 2200 / d2;
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f;
        b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    for (const e of edges) {
      const dx = e.to.x - e.from.x, dy = e.to.y - e.from.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - 110) * 0.01;
      e.from.vx += (dx / d) * f; e.from.vy += (dy / d) * f;
      e.to.vx -= (dx / d) * f; e.to.vy -= (dy / d) * f;
    }
    for (const n of nodes) {
      n.vx += (w / 2 - n.x) * 0.0015;
      n.vy += (h / 2 - n.y) * 0.0015;
      if (n !== dragNode) { n.x += n.vx; n.y += n.vy; }
      n.vx *= 0.85; n.vy *= 0.85;
    }
  }

  function radius(n) { return 5 + Math.min(n.degree * 1.5, 12); }

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
    ctx.strokeStyle = "#2b3542";
    ctx.lineWidth = 1;
    for (const e of edges) {
      ctx.beginPath();
      ctx.moveTo(e.from.x, e.from.y);
      ctx.lineTo(e.to.x, e.to.y);
      ctx.stroke();
    }
    for (const n of nodes) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, radius(n), 0, Math.PI * 2);
      ctx.fillStyle = n === selected ? "#ffb066" : "#7fb8ff";
      ctx.fill();
      ctx.fillStyle = n === selected ? "#dbe2ea" : "#8b98a9";
      ctx.font = "11px ui-monospace, monospace";
      ctx.fillText(n.title, n.x + radius(n) + 4, n.y + 4);
    }
    ctx.restore();
  }

  function loop() { step(); draw(); requestAnimationFrame(loop); }

  function toWorld(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left - offsetX) / scale, y: (ev.clientY - r.top - offsetY) / scale };
  }
  function hit(p) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const dx = p.x - n.x, dy = p.y - n.y;
      if (dx * dx + dy * dy <= (radius(n) + 3) ** 2) return n;
    }
    return null;
  }

  canvas.addEventListener("mousedown", (ev) => {
    const n = hit(toWorld(ev));
    if (n) { dragNode = n; select(n); }
    else { panning = true; px = ev.clientX; py = ev.clientY; }
  });
  window.addEventListener("mousemove", (ev) => {
    if (dragNode) {
      const p = toWorld(ev);
      dragNode.x = p.x; dragNode.y = p.y; dragNode.vx = 0; dragNode.vy = 0;
    } else if (panning) {
      offsetX += ev.clientX - px; offsetY += ev.clientY - py;
      px = ev.clientX; py = ev.clientY;
    }
  });
  window.addEventListener("mouseup", () => { dragNode = null; panning = false; });
  canvas.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.1 : 0.9;
    const r = canvas.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    offsetX = mx - (mx - offsetX) * factor;
    offsetY = my - (my - offsetY) * factor;
    scale *= factor;
  }, { passive: false });

  async function select(n) {
    selected = n;
    noteSlug.value = n.id;
    say(noteMsg, "loading…");
    const res = await fetch(`/api/vault/note?slug=${encodeURIComponent(n.id)}`);
    if (!res.ok) { say(noteMsg, "not found", "err"); noteEdit.value = ""; return; }
    const { body } = await res.json();
    noteEdit.value = body;
    say(noteMsg, "");
  }

  document.getElementById("note-new").addEventListener("click", () => {
    selected = null; noteSlug.value = ""; noteEdit.value = ""; noteSlug.focus();
  });
  document.getElementById("note-save").addEventListener("click", async () => {
    const slug = noteSlug.value.trim();
    if (!slug) return say(noteMsg, "slug required", "err");
    const res = await fetch("/api/vault/note", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ slug, body: noteEdit.value }),
    });
    if (!res.ok) return say(noteMsg, (await res.json()).error ?? "failed", "err");
    say(noteMsg, "saved", "ok");
    load();
  });

  async function loadSkills() {
    const el = document.getElementById("skills");
    const { skills } = await fetch("/api/skills").then((r) => r.json());
    el.innerHTML = "";
    if (!skills.length) {
      el.innerHTML = '<span class="hint">no skills yet — PUT /api/skills/:name</span>';
      return;
    }
    const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    for (const s of skills) {
      const div = document.createElement("div");
      div.className = "skill";
      div.style.cursor = "pointer";
      div.innerHTML = `<b>${esc(s.meta.name)}</b> <span class="meta">v${esc(s.meta.version)}</span>
        <div class="meta">${esc(s.meta.description)}</div>
        <div>${s.meta.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
      div.addEventListener("click", () => loadSkill(s.meta.name));
      el.appendChild(div);
    }
  }

  const skillName = document.getElementById("skill-name");
  const skillEdit = document.getElementById("skill-edit");
  const skillMsg = document.getElementById("skill-msg");
  async function loadSkill(name) {
    skillName.value = name;
    const res = await fetch(`/api/skills/${encodeURIComponent(name)}`);
    if (!res.ok) return say(skillMsg, "not found", "err");
    skillEdit.value = (await res.json()).body;
    say(skillMsg, "");
  }
  document.getElementById("skill-load").addEventListener("click", () => {
    if (skillName.value.trim()) loadSkill(skillName.value.trim());
  });
  document.getElementById("skill-save").addEventListener("click", async () => {
    const name = skillName.value.trim();
    if (!name) return say(skillMsg, "name required", "err");
    const res = await fetch(`/api/skills/${encodeURIComponent(name)}`, {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ body: skillEdit.value }),
    });
    if (!res.ok) return say(skillMsg, (await res.json()).error ?? "failed", "err");
    say(skillMsg, "saved", "ok");
    loadSkills();
  });
  document.getElementById("skill-delete").addEventListener("click", async () => {
    const name = skillName.value.trim();
    if (!name) return say(skillMsg, "name required", "err");
    if (!confirm(`Delete skill "${name}"?`)) return;
    const res = await fetch(`/api/skills/${encodeURIComponent(name)}`, { method: "DELETE" });
    if (!res.ok) return say(skillMsg, (await res.json()).error ?? "failed", "err");
    skillEdit.value = ""; say(skillMsg, "deleted", "ok");
    loadSkills();
  });

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onclose = () => setTimeout(connect, 1500);
    ws.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.kind === "vault.updated") load();
    };
  }

  resize();
  load().then(loop);
  loadSkills();
  connect();
</script>
</body>
</html>
