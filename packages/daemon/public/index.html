<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA — debug console</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --card:#161b22; --line:#242c37; --tx:#dbe2ea; --dim:#8b98a9; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; background:var(--bg); color:var(--tx); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header b { font-size:15px; letter-spacing:.14em; }
  header span { color:var(--dim); }
  main { display:grid; grid-template-columns: 340px 1fr; gap:0; height:calc(100vh - 46px); }
  #agents { border-right:1px solid var(--line); overflow-y:auto; padding:10px; }
  .agent { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .agent h3 { margin:0 0 4px; font-size:13px; display:flex; justify-content:space-between; }
  .status { padding:1px 8px; border-radius:10px; font-size:11px; background:#22303f; }
  .status.active { background:#0f3f2e; color:#5ee0a0; }
  .status.blocked { background:#4a2b12; color:#ffb066; }
  .status.researching { background:#1d3a5f; color:#7fb8ff; }
  .status.idle, .status.offline { color:var(--dim); }
  .status.error { background:#4a1520; color:#ff7b8a; }
  .meta { color:var(--dim); font-size:11px; }
  #log { overflow-y:auto; padding:10px 14px; }
  .ev { padding:2px 0; border-bottom:1px dotted #1c232d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev .t { color:var(--dim); margin-right:8px; }
  .ev .a { color:#7fb8ff; margin-right:8px; }
  .ev.tool-deny .s, .ev.tool-ask .s { color:#ffb066; }
  .ev.system-error .s { color:#ff7b8a; }
</style>
</head>
<body>
<header><b>AURA</b><span id="conn">connecting…</span><span id="count"></span><a href="/graph.html" style="color:#8b98a9;text-decoration:none">graph</a></header>
<main>
  <div id="agents"></div>
  <div id="log"></div>
</main>
<script>
  const agents = new Map();
  const agentsEl = document.getElementById("agents");
  const logEl = document.getElementById("log");
  const connEl = document.getElementById("conn");
  const countEl = document.getElementById("count");

  function renderAgents() {
    agentsEl.innerHTML = "";
    for (const a of agents.values()) {
      const el = document.createElement("div");
      el.className = "agent";
      const tok = a.tokens ? (a.tokens.input + a.tokens.output).toLocaleString() : "0";
      el.innerHTML = `<h3>${a.agentId}<span class="status ${a.status}">${a.status}</span></h3>
        <div class="meta">task: ${a.task || "—"}</div>
        <div class="meta">tokens: ${tok} · session: ${a.sessionId.slice(0,8)}</div>`;
      agentsEl.appendChild(el);
    }
    countEl.textContent = `${agents.size} agent${agents.size === 1 ? "" : "s"}`;
  }

  function addLog(ev) {
    const el = document.createElement("div");
    el.className = "ev " + ev.type.replace(".", "-");
    const t = new Date(ev.ts).toTimeString().slice(0, 8);
    el.innerHTML = `<span class="t">${t}</span><span class="a">${ev.agentId}</span><span class="s">[${ev.type}] ${ev.summary}</span>`;
    logEl.prepend(el);
    while (logEl.childElementCount > 500) logEl.lastChild.remove();
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { connEl.textContent = "live"; };
    ws.onclose = () => { connEl.textContent = "reconnecting…"; setTimeout(connect, 1500); };
    ws.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.kind === "hello") {
        for (const a of msg.agents) agents.set(a.agentId, a);
        renderAgents();
      } else if (msg.kind === "snapshot") {
        agents.set(msg.agent.agentId, msg.agent);
        renderAgents();
      } else if (msg.kind === "event") {
        addLog(msg.event);
      }
    };
  }
  connect();
</script>
</body>
</html>
